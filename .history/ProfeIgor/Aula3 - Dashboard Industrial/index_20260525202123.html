<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Petemoss&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-straight/css/uicons-bold-straight.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container-central">
        <div class="card-central">
            <div class="card-central-icone">
                <i class="fi fi-sr-bolt"></i>            
            </div>
            <div class="card-central-conteudo">
                <h1>STATUS DE OPERAÇÃO GLOBAL</h1>
                <p>SISTEMA OPERAL: NOMINAL</p>
            </div>
            <a href="">RELATÓRIO COMPLETO</a>
        </div>
        <div class="grid">
            <div class="card">
                <i class="fi fi-bs-circle-p"></i>
                <h2>PRESSÃO</h2>
                <p>120 PSI</p>
                <a href="">Ver histórico</a>
            </div>
            <div class="card">
                <i class="fi fi-br-circle-t"></i>
                <h2>TEMPERATURA</h2>
                <p>45.2 °C</p>
                <a href="">Ver histórico</a>
            </div>
            <div class="card">
                <i class="fi fi-bs-circle-r"></i>
                <h2>ROTAÇÃO</h2>
                <p>1850 RPM</p>
                <a href="">Ver histórico</a>
            </div>
            <div class="card">
                <i class="fi fi-bs-circle-c"></i>
                <h2>CARGA</h2>
                <p>82%</p>
                <a href="">Ver histórico</a>
            </div>
            <div class="card">
                <i class="fi fi-bs-circle-v"></i>
                <h2>VIBRAÇÃO</h2>
                <p>3.2 mm/s</p>
                <a href="">Ver histórico</a>
            </div>
        </div>
    </div>
</body>
</html>

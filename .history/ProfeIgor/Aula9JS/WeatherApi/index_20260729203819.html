<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>

<div class="overlay">

    <div class="weather-card">

        <h1>Weather</h1>

        <div class="search">

            <input
                type="text"
                placeholder="Digite uma cidade">

            <button>
                🔍
            </button>

        </div>

        <div class="weather">

            <img>

            <h2></h2>

            <h3>Joinville</h3>

            <p>Céu limpo</p>

        </div>

        <div class="details">

            <div>
                <span>💧</span>
                <p>Umidade</p>
                <strong>78%</strong>
            </div>

            <div>
                <span>🌬️</span>
                <p>Vento</p>
                <strong>14 km/h</strong>
            </div>

            <div>
                <span>🌡️</span>
                <p>Sensação</p>
                <strong>31°C</strong>
            </div>

        </div>

    </div>

</div>

</body>
</html>

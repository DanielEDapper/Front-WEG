<!-- O que é o local storage?? 
O Local Storage é um recurso do navegador WEB que permite salvar dados no computador do usuario de forma simples, leve e permanente.

Diferente das variaveis comuns do JAVASCRIPT(que "resetam" e esquecem tudo assim que a página é recarregada, os dados salvos no LOCALSTORAGE) não somem ao fechar a aba do navegador. Eles continuam lá. até que o usuário limpe o histórico ou o código os apague intencionalmente.-->

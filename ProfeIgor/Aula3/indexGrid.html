<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cssGrid.css">
    <title>Grid-Column</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="grid">

        <h1 class="title">
            Furadeira Profissional
        </h1>

        <span class="price">
            R$ 249
        </span>

        <img
            class="photo"
            src="./img/furadeira.png"
            alt="Furadeira Profissional"
        >

        <p class="description">
            Furadeira profissional de alta potência,
            ideal para construção civil e uso industrial.
        </p>

        <a class="buy" href="/">
            Comprar
        </a>

    </div>

</body>
</html>
